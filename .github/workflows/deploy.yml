name: Refresh data and deploy

# The card index is never committed — it is fetched here and shipped straight to
# GitHub Pages, so the repository does not grow by several megabytes every week.
on:
  push:
    branches: [main]
  schedule:
    # Mondays, 05:00 UTC. New sets and price movement land during the week.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch card data from YGOPRODeck
        run: npm run fetch-data

      - name: Fetch text recognition engine
        run: npm run fetch-ocr
        env:
          # The full cardinfo.php dump is a large JSON body to parse.
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run build
      # One-time manual setup: Settings -> Pages -> Source -> "GitHub Actions".
      # The workflow cannot do this itself — creating a Pages site is not something
      # GITHUB_TOKEN is allowed to do ("Resource not accessible by integration"),
      # so `enablement: true` fails here too.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
